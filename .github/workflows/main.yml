name: Build Portable Package

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Find node.exe path
        id: node_path
        run: |
          $nodePath = (Get-Command node).Source
          echo "NODE_EXE_PATH=$nodePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build with PyInstaller (onedir)
        run: |
          pyinstaller --onedir --name deepseek-free-api `
            --hidden-import=curl_cffi `
            --add-data "pow_solver.js;." `
            --add-data "pow_native.py;." `
            --add-data "sha3_wasm_bg.wasm;." `
            proxy.py

      - name: Copy Node.js runtime and extra files
        run: |
          Copy-Item -Path "$env:NODE_EXE_PATH" -Destination "dist\deepseek-free-api\"
          Copy-Item -Path "pow_solver.js" -Destination "dist\deepseek-free-api\" -Force
          Copy-Item -Path "pow_native.py" -Destination "dist\deepseek-free-api\" -Force
          Copy-Item -Path "sha3_wasm_bg.wasm" -Destination "dist\deepseek-free-api\" -Force
          Copy-Item -Path "README.md" -Destination "dist\deepseek-free-api\" -ErrorAction SilentlyContinue
          Copy-Item -Path "deploy.sh" -Destination "dist\deepseek-free-api\" -ErrorAction SilentlyContinue

      - name: Create run.bat launcher
        run: |
          @"
          @echo off
          set PATH=%~dp0;%PATH%
          echo Starting DeepSeek Free API...
          echo Visit http://localhost:8000/admin after startup
          "%~dp0deepseek-free-api.exe"
          pause
          "@ | Out-File -FilePath "dist\deepseek-free-api\run.bat" -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-free-api-portable
          path: dist/deepseek-free-api
