name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools
          pip install -r requirements.txt
          pip install pyinstaller

      # ✅ 正确的文件列表查看（PowerShell 兼容）
      - name: List all Python files
        run: |
          Write-Host "=== 根目录文件 ==="
          Get-ChildItem -File
          Write-Host "=== 递归查找所有 .py 文件 ==="
          Get-ChildItem -Recurse -Filter *.py | Select-Object FullName

      # 可选：查看 README 了解启动方式（便于调试）
      - name: Show README (first 30 lines)
        run: |
          Get-Content README.md -Head 30

      # ✅ 使用 proxy.py 作为入口打包（最可能的入口文件）
      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --name deepseek-free-api --hidden-import=curl_cffi proxy.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-free-api-windows
          path: dist/*.exe
